<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Helia ♡</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Georgia", serif;
        color: #F1F8F3;
        background:
            radial-gradient(circle at 20% 20%, #2E7D4F 0%, transparent 30%),
            radial-gradient(circle at 80% 80%, #1B5E35 0%, transparent 35%),
            #0B3D24;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    .decor {
        position: fixed;
        color: #6FBF82;
        font-size: 25px;
        opacity: 0.8;
        pointer-events: none;
    }

    .decor.one {
        top: 8%;
        left: 8%;
    }

    .decor.two {
        top: 15%;
        right: 10%;
    }

    .decor.three {
        bottom: 12%;
        left: 12%;
    }

    .decor.four {
        bottom: 8%;
        right: 8%;
    }

    .card {
        width: 90%;
        max-width: 650px;
        min-height: 520px;
        padding: 55px 35px;
        border-radius: 28px;
        background: #14532D;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.35),
            0 0 35px rgba(72, 187, 104, 0.18);
        text-align: center;
        position: relative;
        overflow: hidden;
        border: 1px solid #347A4D;
    }

    .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 410px;
    }

    .top {
        font-size: 15px;
        letter-spacing: 3px;
        color: #9BE2AA;
        margin-bottom: 18px;
    }

    .icon {
        font-size: 38px;
        color: #72C987;
        margin-bottom: 15px;
    }

    h1 {
        font-size: 52px;
        margin: 5px 0 18px;
        color: #FFFFFF;
        letter-spacing: 1px;
    }

    .line {
        width: 90px;
        height: 3px;
        background: #62B878;
        border-radius: 10px;
        margin: 5px auto 25px;
    }

    p {
        max-width: 470px;
        line-height: 1.8;
        font-size: 17px;
        color: #D7F0DD;
        margin: 0 auto 28px;
    }

    button {
        border: none;
        padding: 13px 28px;
        border-radius: 30px;
        background: #238B45;
        color: white;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        transition: 0.25s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    button:hover {
        background: #2EAD55;
        transform: translateY(-2px);
    }

    .date-box {
        margin-top: 25px;
        padding: 14px 25px;
        border-radius: 18px;
        background: #0F4228;
        border: 1px solid #3F8F56;
        color: #A9E5B5;
        font-size: 16px;
    }

    .hidden {
        display: none;
    }

    .small-heart {
        color: #7BD88D;
        font-size: 20px;
        margin-top: 22px;
    }

    @media (max-width: 600px) {
        .card {
            padding: 40px 22px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="decor one">🌿</div>
<div class="decor two">🍃</div>
<div class="decor three">🌱</div>
<div class="decor four">🌿</div>

<div class="card">

    <!-- PAGE 1 -->
    <div class="page" id="page1">

        <div class="top">A LITTLE PAGE FOR YOU</div>

        <div class="icon">🌿</div>

        <h1>Happy Birthday<br>Helia</h1>

        <div class="line"></div>

        <p>
            A little page made especially for you,
            for a very special day.
        </p>

        <button onclick="openPage2()">
            Open ♡
        </button>

    </div>


    <!-- PAGE 2 -->
    <div class="page hidden" id="page2">

        <div class="icon">🍃</div>

        <h1>For Helia ♡</h1>

        <div class="line"></div>

        <p>
            I hope this new year of your life
            brings you lots of beautiful moments,
            good memories and reasons to smile.
        </p>

        <div class="date-box">
            15 September · Your Day ♡
        </div>

        <div class="small-heart">🌱</div>

        <br>

        <button onclick="openPage1()">
            Back
        </button>

    </div>

</div>

<script>
function openPage2() {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function openPage1() {
    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page1").classList.remove("hidden");
}
</script>

</body>
</html>
